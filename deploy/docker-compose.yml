services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: securelife-bot:latest
    container_name: securelife-bot
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - bot-data:/data
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'src.main' >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  bot-data:
